# 桌面客户端安装包 · 原生构建矩阵
#
# ★为什么必须有这个文件：**Tauri 桌面端不能交叉编译**。本机（macOS）实测
#   `cargo check --target x86_64-unknown-linux-gnu` 在 gdk-sys/gobject-sys/glib-sys 上失败，
#   报的是「pkg-config has not been configured to support cross-compilation」——
#   要过这一关得有目标系统的 GTK/WebKit 开发库，不是装个 rust target 就行的。
#   于是 Windows/Linux 的包只可能在原生系统（或其容器）里构建，本机永远出不来。
#   详见 clients/BUILD.md。
#
# ★三个平台的真伪边界（不许在别处写得比这更乐观）：
#   - macOS   ：唯一在真机上跑通过隧道的平台。产物是 universal dmg，**未签名未公证**。
#   - Linux   ：包能出，数据面代码（tun + pkexec 提权）**未实机验证**。
#   - Windows ：包能出且**自带 wintun.dll**（baidi-tun 建虚拟网卡要它）。DLL 不入库，
#               构建期从官方取件 + SHA-256 强校验（fetch-wintun.sh），随包分发的依据是
#               Wintun 预编译许可第 3(d) 条的例外；许可原文一并装进包里 —— 那是我们自愿的，
#               许可原文并未要求随包附带（别在别处把它写成许可的硬性要求）。
#               安装器是 **perMachine**（装 Program Files、需管理员）：缺省的 currentUser
#               会把随后被 UAC 提权加载的 wintun.dll / baidi-tun.exe 放进用户可写目录。
#               产物**未签名**（没有证书），Windows 侧没有第二道完整性兜底。
#               装完之后仍**只是"应该能用"**：UAC 提权、建卡、NRPT 分离式 DNS 全部
#               **未在真实 Windows 上跑过**，产物照旧打 UNVERIFIED 标记并附说明，
#               **刻意不进下载中心 manifest**。
#               ★DLL 必须与 **baidi-tun.exe 同目录**（wintun 用 LoadLibraryEx 只看
#               「发起加载的进程自身 exe 目录」与 System32），落错地方的症状是包照样
#               打得出、装得上，只在用户点「接入」那一刻失败——下面两步断言就是为它设的。
#
# ★本文件未在 GitHub Actions 上真实运行过（本机无法运行 Actions）。语法过 actionlint，
#   但「runner 上是否真的能出包」尚待第一次真实运行验证；红了先看步骤名，别怀疑构建脚本。

name: 客户端安装包

on:
  workflow_dispatch:
  push:
    # feat/** 也触发：这条流水线**从未在 Actions 上真实跑过**，
    # 只在 main 上触发意味着第一次真实运行必须发生在合并之后——
    # 那时若它是坏的，坏的是主干。特性分支先跑通再合，才是正确顺序。
    branches: [main, 'feat/**']
    paths:
      - 'clients/**'
      - 'gateway/cmd/baidi-tun/**'
      - 'gateway/cmd/baidi-knock/**'
      - 'gateway/internal/dataplane/**'
      - '.github/workflows/clients.yml'
  pull_request:
    paths:
      - 'clients/**'
      - 'gateway/cmd/baidi-tun/**'
      - 'gateway/cmd/baidi-knock/**'
      - 'gateway/internal/dataplane/**'
      - '.github/workflows/clients.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 预检：几秒钟内拦掉「要等五分钟才炸在最后一步」的那几类错 ──────────────
  #
  # ★这个 job 是首次真跑 CI 的直接产物。那一轮三条腿全红、零产物，三个失败点是：
  #   macOS  → build-sidecars.sh 在 UTF-8 locale 下 `GOARCH�: unbound variable`
  #   Windows→ 打包最后一步 `Couldn't find a .ico icon`
  #   Linux  → AppImage 打包 panic `couldn't find a square icon`（退出码 134）
  # 三条都是**静态可判定**的，却各自烧掉了一整轮编译（Windows 那条是 5 分 24 秒的
  # release 编译之后才报）。更糟的是它们互相遮挡：修好一个才看得见下一个。
  # 下面两项检查合起来只要几秒，且当时能同时报出全部三条。
  preflight:
    name: 预检（静态可判定的错，别烧一轮编译）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shell 脚本：变量名后紧跟全角字符必须用 ${} 包起来
        run: |
          # macOS 自带 bash 3.2，在 UTF-8 locale 下会把紧跟 `$VAR` 的全角字符（`）`、`，`…）
          # 的**首字节吞进变量名**，于是查的是 `GOARCH\xef` 这个不存在的变量。
          # 精确复现：
          #   LC_ALL=en_US.UTF-8 bash -c 'set -u; A=1; echo "（$A）"'  → A�: unbound variable
          #   LC_ALL=C           bash -c 'set -u; A=1; echo "（$A）"'  → （1）
          # 本项目所有提示语都是中文，这个写法遍地都是（当时全仓 52 处）。
          # ★`set -u` 让它当场炸是运气好：没开 `set -u` 的脚本里，它**静默展开成空串**——
          #   `rm -rf "$PREFIX/x"` 这类地方错成什么样不用多说。
          # 扫全仓而不只是 clients/：gateway/*.sh 与 deploy/*.sh 同样有人在 mac 上跑。
          python3 - <<'PY'
          import re, subprocess, pathlib, sys
          VENDORED = {"clients/mobile/native/android/gradlew"}  # 第三方文件，不归我们管
          pat = re.compile(rb'\$([A-Za-z_][A-Za-z0-9_]*)(?=[\x80-\xff])')
          hits = []
          for f in subprocess.run(["git", "ls-files", "*.sh", "*.bash"],
                                  capture_output=True, text=True).stdout.split():
              if f in VENDORED:
                  continue
              for i, line in enumerate(pathlib.Path(f).read_bytes().split(b"\n"), 1):
                  for m in pat.finditer(line):
                      hits.append(f"{f}:{i}\t${m.group(1).decode()}"
                                  f"  →  {line.decode('utf-8','replace').strip()[:100]}")
          if hits:
              print("✗ 下列位置的 $变量 后面紧跟非 ASCII 字符，请改成 ${变量}：")
              print("\n".join("  " + h for h in hits))
              sys.exit(1)
          print("✓ 无裸 $变量 紧邻全角字符")
          PY

      - name: shell 脚本：语法自检
        run: |
          bad=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "✗ ${f} 语法错误"; bad=1; }
          done
          [ "$bad" = 0 ] && echo "✓ 全部 shell 脚本语法通过"
          exit "$bad"

      - name: Tauri 打包配置：图标声明齐全且文件真的在
        run: |
          # `bundle.icon` 默认是**空列表**，不是"自动扫 icons/ 目录"。icons/ 里 19 个图标
          # 一应俱全、全都 tracked，而配置里没写 icon —— Windows 与 AppImage 就都会在
          # 打包最后一步失败。src-tauri/src/elevate.rs 里有一条同义的 Rust 断言；
          # 两个执行方判据独立（那边 include_str! 解析、这边直接查盘），刻意不合并。
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("clients/desktop/src-tauri")
          icons = json.loads((root / "tauri.conf.json").read_text())["bundle"].get("icon", [])
          errs = []
          if not icons:
              errs.append("bundle.icon 为空或缺失")
          errs += [f"bundle.icon 列了 {p} 但盘上没有" for p in icons if not (root / p).is_file()]
          if not any(p.endswith(".ico") for p in icons):
              errs.append("缺 .ico —— msi 与 nsis 都只认它")
          def square(p):
              s = pathlib.Path(p).stem.removesuffix("@2x").split("x")
              return len(s) == 2 and s[0] and s[0] == s[1]
          if not any(square(p) for p in icons):
              errs.append("缺方形 PNG（如 128x128.png）—— AppImage 找不到会直接 panic")
          if errs:
              print("✗ " + "\n✗ ".join(errs)); sys.exit(1)
          print(f"✓ 图标声明齐全：{icons}")
          PY

      - name: Tauri 打包配置：非 ASCII 产品名必须配得下的 MSI 码页
        run: |
          # productName 是「白帝安全接入客户端」，全非 ASCII。tauri 把它原样注入 main.wxs
          # 十几处，而缺省 MSI 数据库是单字节码页 → light.exe 报 LGHT0311。
          # 规则钉在成因上：产品名是纯 ASCII 时这条自动不适用。
          # src-tauri/src/elevate.rs 有同义 Rust 断言，判据独立（那边 include_str! 解析）。
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("clients/desktop/src-tauri")
          name = json.loads((root / "tauri.conf.json").read_text())["productName"]
          if name.isascii():
              print(f"✓ productName「{name}」是纯 ASCII，缺省码页够用"); sys.exit(0)
          win = json.loads((root / "tauri.windows.conf.json").read_text())
          wix = win["bundle"]["windows"].get("wix", {})
          langs = wix.get("language")
          errs = []
          if not isinstance(langs, dict) or not langs:
              errs.append(f"productName「{name}」含非 ASCII，必须配 bundle.windows.wix.language "
                          "指向声明了 CJK 码页的 .wxl（否则 LGHT0311；msi 又是先跑的那个，"
                          "它一挂 NSIS 根本不会执行）")
          for culture, cfg in (langs or {}).items():
              p = root / (cfg or {}).get("localePath", "")
              if not p.is_file():
                  errs.append(f"{culture} 的 localePath 指向 {p}，盘上没有"); continue
              t = p.read_text()
              cp = t.split('Codepage="')[1].split('"')[0] if 'Codepage="' in t else None
              if cp not in ("936", "950", "932", "949"):
                  errs.append(f"{p} 的 Codepage={cp} 装不下 CJK（要 936=GBK 这类多字节页；"
                              "65001 在 WiX 3 上会转成 LGHT0313）")
              if "</WixLocalization>" not in t:
                  errs.append(f"{p} 不能写成自闭合标签 —— tauri 靠替换 </WixLocalization> "
                              "注入缺省字符串，没有锚点会静默失败，最后炸在 LGHT0102")
          if len(str(wix.get("upgradeCode", ""))) != 36:
              errs.append("wix.upgradeCode 必须钉固定 GUID：缺省值随 productName 派生，"
                          "改名会让老用户机上并存两份而不是升级")
          if errs:
              print("✗ " + "\n✗ ".join(errs)); sys.exit(1)
          print(f"✓ 非 ASCII 产品名「{name}」的 MSI 码页已配妥")
          PY

  desktop:
    name: ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂掉不该连累另外两个：Windows 还没实机验证过，别让它拖着 macOS 的包不出。
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS · universal dmg
          - os: ubuntu-latest
            label: Linux · deb + AppImage（未实机验证）
          - os: windows-latest
            label: Windows · msi + nsis（未实机验证，自带 wintun.dll）

    defaults:
      run:
        # 三个平台同一套 bash 脚本（Windows 上是 Git Bash），省掉一份 PowerShell 分身。
        # 例外只有两处：下面两步 Windows 专属断言用 pwsh。理由不是偏好——那两步要读 PE 头、
        # 要调 `msiexec /a`，而 MSYS 的路径转换会把 `/a` 当成路径改写掉（症状是 msiexec 弹一个
        # 用法对话框然后超时），绕开它的写法比换个 shell 更难读也更容易被下一个人改坏。
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          # ★fetch-depth: 0 不是"顺手要全history"：溯源取的是 `git log -1 -- clients/`，
          # 这是**路径过滤**的查询。默认的深度 1 浅克隆下，只要本次提交没碰 clients/，
          # 它就返回空 → 包被标成「无法判断新旧」，而构建日志里一切正常。
          fetch-depth: 0

      - name: 取 clients/ 子树 commit（构建溯源）
        id: rev
        run: |
          REV="$(git log -1 --format=%h -- clients/)"
          if [ -z "$REV" ]; then
            echo "✗ 取不到 clients/ 子树 commit（checkout 是不是又变回浅克隆了？）"
            exit 1
          fi
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "→ clients/ 子树版本：$REV"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Go（版本随 gateway/go.mod，sidecar 是 Go 编的）
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Rust 两个 darwin 目标（universal 打包要 lipo 两份产物）
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux 系统依赖（Tauri v2 官方清单）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
          # patchelf 不在官方那张表里，是 AppImage 打包实际会用到的（改 rpath）。
          # 缺它的症状是 appimage 那步很晚才失败，deb 却是好的。

      - name: cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clients/desktop/src-tauri/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('clients/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-

      - name: 构建 sidecar（baidi-knock + baidi-tun）
        run: bash clients/desktop/src-tauri/build-sidecars.sh

      - name: 核对 sidecar 命名
        run: |
          # Tauri 的 externalBin 是**精确按名字**找的：binaries/<name>-<host 三元组>[.exe]。
          # 名字差一个字（尤其 Windows 少了 .exe），tauri build 只会说「找不到 sidecar」，
          # 与"Go 没编出来"完全同形。在这里先断言一次，把两种失败分开。
          TRIPLE="$(rustc -vV | sed -n 's/host: //p' | tr -d '\r')"
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          for b in baidi-knock baidi-tun; do
            f="clients/desktop/src-tauri/binaries/$b-$TRIPLE$EXT"
            if [ ! -f "$f" ]; then
              echo "✗ 缺 sidecar：$f"
              ls -la clients/desktop/src-tauri/binaries/ || true
              exit 1
            fi
            echo "✓ $f"
          done

      # ── Windows 专属：wintun.dll 的打包输入 ──
      #
      # 取件本身在 build-sidecars.sh 里（GOOS=windows 分支调 fetch-wintun.sh，官方 zip +
      # SHA-256 强校验）。这一步只做**输入侧**的断言，与打包后那一步是两码事：
      # 这里管"取到的这份对不对"，那里管"它有没有进包、进到哪个目录"。
      - name: 核对 wintun 打包输入（DLL / 许可齐全，且架构与 runner 一致）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'clients/desktop/src-tauri/binaries/wintun'
          foreach ($f in @('wintun.dll', 'LICENSE.txt')) {
            if (-not (Test-Path "$stage/$f")) {
              # 许可缺席不是小事：不是因为 Wintun 的许可强制附带（它没有这一条 ——
              # 3(c) 管的是"不得从 DLL 里剥掉版权注记"），而是因为**我们对外说了会附**
              # （README-windows.txt、BUILD.md）。说过的话要有执行方，故与 DLL 同档当硬失败。
              Write-Host "✗ 缺 $stage/$f（fetch-wintun.sh 没跑成？）"
              Get-ChildItem -Recurse $stage -ErrorAction SilentlyContinue | Out-Host
              exit 1
            }
          }
          # ★架构复核：zip 里有 amd64/arm64/x86/arm 四份，选错一份的话包照样打得出、
          #   装得上、DLL 也确实躺在 baidi-tun.exe 旁边，只有用户点「接入」那一刻炸。
          #   判据与客户端运行期那道（elevate.rs::pe_machine）同一套 PE 头解析。
          $bytes = [System.IO.File]::ReadAllBytes("$stage/wintun.dll")
          if ($bytes.Length -lt 0x40 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Host "✗ $stage/wintun.dll 不是 PE 文件（下载被截断？）"; exit 1
          }
          $off = [BitConverter]::ToUInt32($bytes, 0x3C)
          if ($off + 6 -gt $bytes.Length -or $bytes[$off] -ne 0x50 -or $bytes[$off+1] -ne 0x45) {
            Write-Host "✗ $stage/wintun.dll 的 PE 签名对不上"; exit 1
          }
          $machine = [BitConverter]::ToUInt16($bytes, $off + 4)
          $triple = (& rustc -vV | Select-String '^host: ').ToString().Substring(6).Trim()
          $want = switch -Wildcard ($triple) {
            'x86_64-*'  { 0x8664 }
            'aarch64-*' { 0xAA64 }
            default     { Write-Host "✗ 未适配的三元组 $triple"; exit 1 }
          }
          if ($machine -ne $want) {
            Write-Host ("✗ wintun.dll 架构错配：DLL machine=0x{0:x4}，runner 三元组 {1} 需要 0x{2:x4}" -f $machine, $triple, $want)
            exit 1
          }
          Write-Host ("✓ wintun.dll machine=0x{0:x4}（{1}），许可 {2} 字节" -f $machine, $triple, (Get-Item "$stage/LICENSE.txt").Length)

      - name: 前端依赖
        working-directory: clients/desktop
        run: npm ci

      - name: 打包（macOS · universal dmg）
        if: runner.os == 'macOS'
        working-directory: clients/desktop
        run: npm run tauri:build -- --target universal-apple-darwin

      - name: 打包（Linux · deb）
        if: runner.os == 'Linux'
        working-directory: clients/desktop
        run: npm run tauri:build -- --bundles deb

      - name: 打包（Linux · AppImage）
        # 与 deb 分成两步：AppImage 是这套里最脆的一环（linuxdeploy + FUSE + strip 都可能出岔），
        # 合成一步的话，AppImage 挂了会让日志看起来像"Linux 根本编不过"。
        if: runner.os == 'Linux'
        working-directory: clients/desktop
        run: npm run tauri:build -- --bundles appimage

      - name: Rust 单测（打包配置那批守卫此前在 CI 上一次都没跑过）
        # src-tauri 有 70 个单测，其中好几条守的正是**打包配置**：wintun 必须用映射形
        # 落到安装根目录、NSIS 必须 perMachine、图标必须齐全、许可义务出处不许张冠李戴。
        # 它们此前只有"开发者本地记得跑"这一个执行方——而 CI 是唯一每次都跑的地方。
        #
        # 放在打包**之后**而不是之前，是为了能用 --release 复用刚编好的依赖（dev profile
        # 要把 tauri 整棵依赖树重编一遍，几分钟全花在关键路径上）。代价是它拦不住本轮，
        # 只能报出来；真正要"拦在编译前"的那几类已经由上面的 preflight job 承担。
        # 只在 Linux 上跑一份：这些断言读的都是配置文件与纯函数，三平台跑出来是同一个结果。
        if: runner.os == 'Linux'
        working-directory: clients/desktop/src-tauri
        run: cargo test --release

      # ★拆成两步、NSIS 在前，理由与 Linux 那边 deb/AppImage 拆开完全同源：
      #   `--bundles msi,nsis` 里 **msi 先跑**（两者 priority 都是 0，稳定排序，前者失败
      #   直接中止整个 bundle 流程）。于是首跑那轮死在 msi 的 `Couldn't find a .ico icon`
      #   时，NSIS 那半**一次都没被执行过**——日志里连 `Verifying NSIS package` 都没有，
      #   而当时看起来就像"Windows 打包坏了"。两个安装器是两套独立实现，一个坏不代表
      #   另一个坏，合成一步会让这件事在日志里无法区分。
      #   第二步用 `!cancelled()` 而不是默认条件：默认下前一步一失败后面全跳过，
      #   那就永远只能看到先跑那个的错，一轮修一个。
      # ★`--verbose`：WiX 的错误在非 verbose 下会被折叠成一句 `error running light.exe`，
      #   带编号的原文（LGHT0311 之类）只在 verbose 里出现——而编号才是能直接定位的东西。
      - name: 打包（Windows · NSIS）
        if: runner.os == 'Windows'
        working-directory: clients/desktop
        run: npm run tauri:build -- --bundles nsis --verbose

      - name: 打包（Windows · MSI）
        if: runner.os == 'Windows' && !cancelled()
        working-directory: clients/desktop
        run: npm run tauri:build -- --bundles msi --verbose

      # ★这一步是本条流水线里最该存在的断言，理由是失败形态：
      #   wintun.dll 没进包、或者进了包但落在子目录（`bundle.resources` 写成列表形就会
      #   保留 `binaries/wintun/` 这层目录），**包照样打得出、装得上、装完文件也确实在**，
      #   只有用户点「接入」那一刻加载失败。构建日志、安装过程、文件清单里全都看不出来。
      #   所以断言的不是"文件在不在包里"，而是"它与 baidi-tun.exe **在同一个目录**"——
      #   那才是 wintun 的加载规则（LOAD_LIBRARY_SEARCH_APPLICATION_DIR）真正要的东西。
      #
      # 两种安装器分开验，因为它们的落位是两套独立实现（tauri-bundler nsis/mod.rs 与
      # msi/mod.rs），一处对不代表另一处对：
      #   - NSIS：验**生成出来的** installer.nsi 脚本（`SetOutPath $INSTDIR` 之后的
      #     `File /oname=` 清单）。这就是安装器将来照做的那份指令，比解包 exe 更直接。
      #   - MSI ：`msiexec /a` 做一次管理式安装（不真装、不需要提权），把文件树摊到临时
      #     目录，直接比对两个文件的父目录是不是同一个。
      - name: 断言 wintun.dll 与 baidi-tun.exe 真的同目录进了安装包
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'clients/desktop/src-tauri/target'
          $fail = $false

          # ★诊断同时写进 job summary（运行页正面那块），不只写日志。
          #   理由很实际：Actions 的日志对**未登录访客一律不可见**（页面只显示
          #   "Sign in to view logs"），而 job summary 跟着运行页一起公开。
          #   这一步是整条流水线里最容易需要人隔着屏幕帮忙看的一步，
          #   把结论放在需要最少权限就能看到的地方，是它自己的一部分职责。
          function Note($m) {
            Write-Host $m
            if ($env:GITHUB_STEP_SUMMARY) { $m | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
          }
          function Block($title, $body) {
            Write-Host $body
            if ($env:GITHUB_STEP_SUMMARY) {
              "`n<details><summary>$title</summary>`n`n``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
              $body | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
              "```````n</details>" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            }
          }
          Note "## Windows 安装包落位断言"

          # ── NSIS ──
          # 常规落点是 target/release/nsis/<arch>/installer.nsi；兜底再全量找一遍，
          # 免得 bundler 换了目录结构时把"落点变了"报成"断言失败"（两者的下一步完全不同）。
          $nsi = Get-ChildItem -Path "$root/release/nsis" -Recurse -Filter 'installer.nsi' -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nsi) {
            $nsi = Get-ChildItem -Path $root -Recurse -Filter 'installer.nsi' -ErrorAction SilentlyContinue |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1
          }
          if (-not $nsi) {
            Note "✗ 找不到生成的 installer.nsi（tauri-bundler 落点变了？）"; exit 1
          }
          Write-Host "→ NSIS 脚本：$($nsi.FullName)"
          $txt = Get-Content -Raw -LiteralPath $nsi.FullName
          # ★安装模式：必须是 perMachine。缺省的 currentUser 会把整个安装目录放进
          #   %LOCALAPPDATA%（用户可写），而 wintun.dll 与 baidi-tun.exe 随后被 UAC 提权加载/执行 ——
          #   任何一个中完整性级别的进程替换掉那份 DLL 就是管理员代码执行。构建期的 SHA-256
          #   钉扎只覆盖构建机上那个 zip，覆盖不到用户机上装好的那一份。
          #   判据取 tauri NSIS 模板里那行字面量（perMachine 时它同时生成
          #   RequestExecutionLevel admin 与 $PROGRAMFILES64 落点），配置里写没写与真生成出什么是两回事。
          if ($txt -notmatch '(?m)^!define INSTALLMODE "perMachine"\s*$') {
            $mode = [regex]::Match($txt, '(?m)^!define INSTALLMODE "(.*)"').Groups[1].Value
            Note "✗ NSIS 安装模式是 '$mode'，必须是 perMachine —— 否则装进用户可写目录，"
            Note "  而里面的 wintun.dll / baidi-tun.exe 会被提权加载。改 tauri.windows.conf.json 的 bundle.windows.nsis.installMode。"
            exit 1
          }
          Write-Host "  ✓ NSIS installMode=perMachine（装进 Program Files，需管理员）"
          $m = [regex]::Match($txt, '(?ms)^Section Install\b.*?^SectionEnd')
          if (-not $m.Success) {
            Note "✗ installer.nsi 里找不到 Section Install"
            Block "installer.nsi 全文" $txt
            exit 1
          }
          $sec = $m.Value
          if ($sec -notmatch '(?m)^\s*SetOutPath \$INSTDIR\s*$') {
            Note "✗ Section Install 里没有 SetOutPath `$INSTDIR —— 相对 oname 的落点不再可推断"; $fail = $true
          }
          foreach ($n in @('wintun.dll', 'wintun-LICENSE.txt', 'baidi-tun.exe', 'baidi-knock.exe')) {
            # oname 必须是**纯文件名**：带上目录（如 binaries\wintun\wintun.dll）就等于装进子目录，
            # 那正是这一步要拦的静默失效。
            if ($sec -match [regex]::Escape("/oname=$n`"")) {
              Write-Host "  ✓ $n → `$INSTDIR"
            } else {
              Note "  ✗ installer.nsi 的 Section Install 里没有 /oname=$n（漏装，或落进了子目录）"
              $fail = $true
            }
          }
          if ($fail) {
            Block "Section Install 原文" $sec; exit 1
          }

          # ── MSI ──
          $msi = Get-ChildItem -Path "$root/release/bundle/msi" -Filter '*.msi' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $msi) { Note "✗ 找不到 msi 产物"; exit 1 }
          $dest = Join-Path $env:RUNNER_TEMP 'baidi-msi-admin'
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # 管理式安装：只摊开文件树，不写注册表、不跑 InstallExecuteSequence 里的自定义动作。
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
                 '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$dest`"")
          if ($p.ExitCode -ne 0) {
            Note "✗ msiexec /a 失败，退出码 $($p.ExitCode)（无法验证 msi 里的落位）"; exit 1
          }
          $dll = Get-ChildItem -Path $dest -Recurse -Filter 'wintun.dll' | Select-Object -First 1
          $tun = Get-ChildItem -Path $dest -Recurse -Filter 'baidi-tun.exe' | Select-Object -First 1
          $lic = Get-ChildItem -Path $dest -Recurse -Filter 'wintun-LICENSE.txt' | Select-Object -First 1
          if (-not $dll) { Note "✗ msi 里没有 wintun.dll"; $fail = $true }
          if (-not $tun) { Note "✗ msi 里没有 baidi-tun.exe"; $fail = $true }
          if (-not $lic) { Note "✗ msi 里没有 wintun-LICENSE.txt（我们承诺许可原文随包附上）"; $fail = $true }
          if ($fail) {
            Block "msi 摊开后的文件树" ((Get-ChildItem -Recurse $dest | ForEach-Object { $_.FullName.Replace($dest, '') }) -join "`n")
            exit 1
          }
          if ($dll.DirectoryName -ne $tun.DirectoryName) {
            Note "✗ msi 里 wintun.dll 与 baidi-tun.exe 不同目录 —— 装完点「接入」会失败："
            Note "    wintun.dll   : $($dll.FullName)"
            Note "    baidi-tun.exe: $($tun.FullName)"
            Note "  （wintun 只看进程自身 exe 目录与 System32，放在别处等于没放）"
            exit 1
          }
          Write-Host "✓ msi：wintun.dll 与 baidi-tun.exe 同在 $($tun.DirectoryName)"
          Write-Host "✓ msi：许可随包 $($lic.FullName)"
          Note "✓ nsis 与 msi 两侧落位都正确：wintun.dll 与 baidi-tun.exe 同目录，许可原文随包。"

      # ★放在断言**之后**：`failure()` 只在「此前已经有步骤失败」时为真。夹在打包与断言
      #   之间的话，打包成功、断言失败的那一轮它会被跳过——而那恰恰是最需要它的一轮
      #   （首次真跑就正是这个形态：msi/nsis 都打出来了，挂在落位断言上，什么都没留下）。
      #   日志会折行会截断，而 main.wxs / installer.nsi 是安装器将来照做的那份指令原文。
      - name: Windows 失败诊断件（打包中间产物，仅失败时）
        if: runner.os == 'Windows' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            clients/desktop/src-tauri/target/release/wix/**/*.wxs
            clients/desktop/src-tauri/target/release/wix/**/*.wxl
            clients/desktop/src-tauri/target/release/nsis/**/installer.nsi


      # ── macOS：汇集进下载中心的产物目录，并注入构建溯源 ──
      - name: 汇集产物 + 生成 manifest（注入 BAIDI_CLIENT_SRC_REV）
        if: runner.os == 'macOS'
        env:
          # ★注入而不是让脚本自己 `git log`：两道保险叠一起（这里注入 + 上面 fetch-depth: 0）。
          # 少了溯源，下载中心会把这个包标成「无法判断新旧」——那正是这套机制刚建立起来的诚实性。
          BAIDI_CLIENT_SRC_REV: ${{ steps.rev.outputs.rev }}
          # ★BAIDI_APK_SRC_REV 刻意不设：本流水线不构建 Android APK（要 JDK + Android SDK +
          # gomobile/NDK，且从没在 CI 上验证过）。清空的 checkout 里根本没有 APK，
          # 此时把当前 commit 塞给它，等于替一个"将来某人放进来的、来路不明的包"预先背书——
          # 那恰恰是溯源机制要消灭的谎。真加了 APK 构建作业，就在那个作业里设它。
          BAIDI_APK_SRC_REV: ''
        run: bash clients/build-artifacts.sh

      - name: 校验 manifest 真的带上了溯源
        if: runner.os == 'macOS'
        run: |
          # 这一步守的是「浅克隆 / 变量没传进去」这类静默退化：manifest 照样生成、
          # 校验和照样对，只是页面从此永远说「无法判断新旧」，没人会报障。
          python3 - <<'PY'
          import json, sys
          m = json.load(open("deploy/artifacts/downloads/manifest.json"))
          bad = [c["platform"] for c in m["clients"]
                 if c.get("available") and not c.get("sourceCommit")]
          if bad:
              sys.exit(f"✗ 这些可下载条目缺 sourceCommit：{bad}")
          ok = [f'{c["platform"]}={c["sourceCommit"]}' for c in m["clients"] if c.get("available")]
          if not ok:
              sys.exit("✗ manifest 里一个可下载条目都没有，dmg 是不是没进 downloads/？")
          print("✓ 溯源已注入：", ", ".join(ok))
          PY

      - name: 上传产物（macOS）
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          # 目录里是 dmg + manifest.json，可直接铺到部署机的 deploy/artifacts/downloads/。
          name: baidi-desktop-macos-universal
          path: deploy/artifacts/downloads/
          if-no-files-found: error

      # ── Linux / Windows：只出 workflow artifact，不进下载中心 manifest ──
      #
      # ★但产物照样要带溯源。这两份包不经 build-artifacts.sh（不进 manifest.json），
      # 于是 sourceCommit/builtAt 没有任何地方记录——下载的人拿到 msi/deb 与一份 README，
      # 却不知道它出自哪个 commit、什么时候构建的。将来有人手工把它铺进 downloads/ 时
      # 只能靠 `git log` 事后猜一个，而猜错的方向恰好是「看起来是新的」。
      # 变量名与 build-artifacts.sh / control 的 clientSourceRev() 同名同义，
      # 铺包的人可以直接 `source build-provenance.env` 再跑汇集脚本。
      # （安卓那边同一条纪律的产物是 apk-provenance.env，见 clients-mobile.yml。）
      - name: 写构建溯源（随 UNVERIFIED 包一起下发）
        if: runner.os != 'macOS'
        env:
          SRC_REV: ${{ steps.rev.outputs.rev }}
        run: |
          BUNDLE=clients/desktop/src-tauri/target/release/bundle
          mkdir -p "$BUNDLE"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > "$BUNDLE/build-provenance.env" <<EOF
          BAIDI_CLIENT_SRC_REV=$SRC_REV
          BAIDI_CLIENT_BUILT_AT=$BUILT_AT
          BAIDI_CLIENT_PLATFORM=$RUNNER_OS
          BAIDI_CLIENT_VERIFIED=no
          EOF
          echo "→ 溯源：$SRC_REV @ $BUILT_AT（$RUNNER_OS）"
          cat "$BUNDLE/build-provenance.env"

      - name: 写 Linux 说明（随包一起下发）
        if: runner.os == 'Linux'
        run: |
          cat > clients/desktop/src-tauri/target/release/bundle/README-linux.txt <<'TXT'
          白帝安全接入客户端 · Linux 包（未实机验证）

          这个包在 GitHub Actions 的 ubuntu runner 上原生构建，能装。但请注意：
          1) 隧道数据面（baidi-tun 建 tun 网卡、改路由）**没有在任何一台真实 Linux 桌面上跑通过**。
             提权走 pkexec（polkit），缺 polkit 时客户端会明说并给出安装命令，不会静默失败。
             Debian/Ubuntu: apt install policykit-1；RHEL/Fedora: dnf install polkit；Arch: pacman -S polkit
          2) 构建机的 glibc 决定了可运行范围：比 runner 更老的发行版可能起不来（报 GLIBC_x.xx not found）。
             要覆盖老发行版，请在对应发行版上自行构建，见 clients/BUILD.md。
          3) 包未签名。
          TXT
          # 溯源与包同行（同上：分开走就等于允许事后猜一个，而猜错的方向是"看起来是新的"）
          {
            echo
            echo "构建溯源（机器可读的一份见同目录 build-provenance.env）："
            sed 's/^/  /' clients/desktop/src-tauri/target/release/bundle/build-provenance.env
          } >> clients/desktop/src-tauri/target/release/bundle/README-linux.txt

      - name: 上传产物（Linux）
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: baidi-desktop-linux-x86_64-UNVERIFIED
          path: |
            clients/desktop/src-tauri/target/release/bundle/deb/*.deb
            clients/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            clients/desktop/src-tauri/target/release/bundle/README-linux.txt
            clients/desktop/src-tauri/target/release/bundle/build-provenance.env
          if-no-files-found: error

      - name: 写 Windows 说明（随包一起下发）
        if: runner.os == 'Windows'
        run: |
          cat > clients/desktop/src-tauri/target/release/bundle/README-windows.txt <<'TXT'
          白帝安全接入客户端 · Windows 包（未实机验证）

          这个包在 GitHub Actions 的 windows runner 上原生构建，组件是齐的：

            wintun.dll —— baidi-tun 在 Windows 上用 Wintun 建虚拟网卡。它随本包一起安装，
            就放在 baidi-tun.exe 同目录（wintun 用 LoadLibraryEx 只看「进程自身 exe 目录」
            与 %SystemRoot%\System32 两处：不看 PATH，不看当前目录）。
            该 DLL 不入本仓库，构建期从官方 https://www.wintun.net/ 取件并逐字节校验
            SHA-256；许可原文见同目录 wintun-LICENSE.txt —— 那是我们主动附上的，
            Wintun 的预编译许可原文并未要求随包附带（它要求的是不得改动 DLL、不得从中
            剥掉版权注记），附上只是为了让拿到这个包的人能读到约束该 DLL 的条款。
            白帝与 WireGuard LLC 无任何关联，本产品未获其背书。

          安装位置：安装器装进 Program Files（需要管理员），不装进 %LOCALAPPDATA%。
            这不是习惯问题——wintun.dll 与 baidi-tun.exe 随后会被 UAC 提权、以管理员身份
            加载和执行，把它们放在一个当前用户就能改写的目录里，等于给任何一个普通权限的
            进程留了一条提权路径。另请注意：**本包没有代码签名**（我们没有证书），
            Windows 会弹 SmartScreen 警告，也没有第二道兜底能替你验证包的完整性 ——
            请只从可信渠道取包，并自行核对下面的构建溯源。

          但请仍按「未验证代码」对待——**没有任何一台真实 Windows 上跑通过**：
            1) UAC 提权路径（Start-Process -Verb RunAs）；
            2) 建虚拟网卡与路由接管；
            3) NRPT 分离式 DNS 的下发与清理。
          以上三项只在 macOS 上做过单元断言。若隧道起不来，客户端会在**弹 UAC 之前**
          把找过的绝对路径原样告诉你（缺 DLL / DLL 架构对不上分别是两句不同的话），
          不会让你白输一次口令再去看一个看不懂的建卡失败。

          正因为「能装 ≠ 验证过」，这个包**不进下载中心**（deploy/artifacts/downloads 的
          manifest 里 Windows 那一行照实说明未实机验证、产物标 UNVERIFIED、请联系管理员，
          **不写「构建中，敬请期待」**——那等于让人一直等一个按现有决策不会下发的包）。
          TXT
          # 溯源与包同行，理由同 Linux 那一步
          {
            echo
            echo "构建溯源（机器可读的一份见同目录 build-provenance.env）："
            sed 's/^/  /' clients/desktop/src-tauri/target/release/bundle/build-provenance.env
          } >> clients/desktop/src-tauri/target/release/bundle/README-windows.txt

      - name: 上传产物（Windows）
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: baidi-desktop-windows-x86_64-UNVERIFIED
          path: |
            clients/desktop/src-tauri/target/release/bundle/msi/*.msi
            clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
            clients/desktop/src-tauri/target/release/bundle/README-windows.txt
            clients/desktop/src-tauri/target/release/bundle/build-provenance.env
          if-no-files-found: error
