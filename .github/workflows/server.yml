# 服务端 · 编译 / 单测 / 全链路自检
#
# ★为什么现在才有这个文件：在它之前，整个仓库的 CI 只有客户端**打包**两条
#   （clients.yml / clients-mobile.yml）。control、gateway、console 三个模块
#   —— 几万行代码、136 个测试文件 —— 唯一的执行方是「开发者记得在本机跑一遍」。
#
#   同一天客户端流水线首次真跑，三条腿全红，五轮才修完；每一轮红的都是
#   「本机怎么跑都对、只在别的机器上错」：bash 3.2 吞全角字符、UTF-8 locale、
#   Windows PowerShell 5.1 按 ANSI 读 .ps1、msi 与 nsis 对同一份配置行为不一致。
#   服务端代码没有理由豁免于同一类问题，只是没人去看而已。
#
# ★两个 Go 版本是真的不同，不是笔误：control 要 1.25.0、gateway 要 1.26.3
#   （见各自 go.mod）。所以分成两个 job 各自 setup-go，**用 go-version-file 而不是
#   写死版本号**——写死的话 go.mod 升级后这里会静默停在旧版本，而 setup-go 会设
#   GOTOOLCHAIN=local，届时报的是"toolchain 太旧"而不是"CI 配置过期"。
#
# ★三个自检脚本（e2e / web-e2e / ipsec-e2e）单列一个 job：它们是本项目**唯一**的
#   真链路证据（真敲门、真隧道、真 IKEv2 协商、真 ESP 加密、真反代），
#   但也最容易因为端口/时序抖动而假红。与单测混在一个 job 里的话，
#   一次抖动会让"代码编不过"和"自检没跑稳"在结果里无法区分。

name: 服务端

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'control/**'
      - 'gateway/**'
      - 'console/**'
      # deploy/** 与 scripts/**：运维脚本此前**两条流水线都不看**——deploy/ 下那几个
      # （deploy.sh / install-remote.sh / promote-standby.sh / wipe-remote.sh）好几个要
      # 以 root 跑、也有人在 mac 上跑，却没有任何 CI 碰过它们。实际后果已经发生过一次：
      # build.sh 里一处 `「$d」` 潜伏三次提交才被另一条流水线偶然撞见。
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'control/**'
      - 'gateway/**'
      - 'console/**'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 工作流文件自身的校验 ─────────────────────────────────────────────────
  #
  # ★为什么这道检查必须放在**另一条**流水线里：工作流文件一旦不合法，
  #   GitHub 会直接零 job —— 连它自己的 preflight 都起不来。也就是说
  #   clients.yml 里所有守卫（全角变量、BOM、图标、码页…）会同时失效，
  #   而页面上只显示一个文件路径、一句 "This workflow graph cannot be shown"，
  #   注解里什么都没有。守卫不能由被守卫的文件自己承载。
  #
  #   实际发生过：job 级 env 里写了 `runner.os`（runner 上下文只在 step 级可用），
  #   yaml.safe_load 照过、肉眼看不出，GitHub 侧整个文件作废。
  #   actionlint 一句话点名到列号。两条流水线互相校验对方的文件，
  #   一条写坏了另一条会报——除非同时写坏两条，那是可以接受的剩余风险。
  actionlint:
    name: 工作流文件校验（守卫不能由被守卫的文件自己承载）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # shellcheck/pyflakes 集成关掉：那两个是**另一类**检查（脚本内容），
          # 这一步只管"这个文件 GitHub 认不认"。混在一起的话，
          # 一条 shell 风格建议会挡住真正致命的上下文错误。
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
          echo "✓ 全部工作流文件通过 actionlint"

      - name: shell 脚本：变量名后紧跟全角字符必须用 ${} 包起来
        # 与 clients.yml 调**同一份**实现。挂在这条流水线上是因为它的 paths 覆盖
        # deploy/** 与 gateway/**，而那两处的脚本才是 root/mac 上真正会被执行的。
        run: bash scripts/check-shell-fullwidth-vars.sh

  go:
    name: Go · ${{ matrix.mod }}（vet + test）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [control, gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.mod }}/go.mod
          cache-dependency-path: ${{ matrix.mod }}/go.sum

      - name: 版本自证（两个模块要求不同，别猜）
        working-directory: ${{ matrix.mod }}
        run: |
          echo "go.mod 要求：$(grep '^go ' go.mod)"
          go version

      - name: go vet
        working-directory: ${{ matrix.mod }}
        run: go vet ./...

      # -race：本项目里网关的连接跟踪、JIT 到期回收、告警冷却、通知派发队列
      # 全是并发结构，而竞态在单跑时几乎不复现。CGO_ENABLED=1 是 -race 的前提
      # （生产构建一律 CGO_ENABLED=0，那是**交叉编译**的要求，与这里不冲突）。
      # ★-count=1（禁用测试结果缓存）不是保守癖，是实测出来的洞：
      #   Go 的测试缓存**不追踪测试用 os.ReadFile 读的模块外文件**。本仓库有一批
      #   跨文件钉扎用例（钉 .github/workflows/clients.yml 的产物清单、真跑
      #   clients/build-artifacts.sh、deploy/promote-standby.sh 干跑），它们的真实输入
      #   在模块外。实测：改 clients.yml 后重跑，结果仍是 `(cached)`——于是 CI 上
      #   setup-go 恢复的 GOCACHE 会让这些用例**永远端出第一次的结论**。
      #   真出过事：clients.yml 的 Windows 产物名模板化之后，钉它的用例在本机必失败，
      #   而其后四次 CI 全绿——绿的是一份陈旧缓存的判决，不是这批提交。
      - name: go test -race（-count=1：测试缓存不追踪模块外文件，见注释）
        working-directory: ${{ matrix.mod }}
        env:
          MOD: ${{ matrix.mod }}
        # 失败时把 FAIL 用例名、DATA RACE 块与失败现场发到 ::error:: 注解——日志与
        # job summary 都需要登录才可读，注解是匿名可见的唯一通道（与 e2e 三步同一条纪律）。
        #
        # ★竞态块必须单独抓：它打印在 `--- FAIL` **之前**（==== / WARNING: DATA RACE 块），
        #   而 `grep -A N '^--- FAIL'` 是往后取窗口，方向反了——栈一行都进不来。
        #   真出过事：一次 ldapsrc 竞态红，注解里只剩 "race detected during execution of
        #   test" 这句结论，本机怎么跑都复现不了，全靠猜。
        # ★提取交给 python3 而不是 grep：GitHub 默认 shell 是 `bash -e {0}`，叠加
        #   `set -o pipefail` 后 grep 无匹配（退出 1）会让整步当场中止，一条注解都发不出；
        #   且 head -c 会把中文测试输出切成半个字符（本仓输出全中文）。
        run: |
          set -o pipefail
          if CGO_ENABLED=1 go test -race -count=1 -timeout 15m ./... 2>&1 | tee /tmp/gotest.log; then
            exit 0
          fi
          python3 - <<'PY'
          import os, pathlib, re

          MOD = os.environ.get("MOD", "?")
          LOG = pathlib.Path("/tmp/gotest.log")
          MAXC = 7000  # 单条注解正文预算（上限约 64KB，但过长会在页面上折叠）
          lines = LOG.read_text(errors="replace").splitlines() if LOG.exists() else []

          def emit(title, body):
              # 顺序不可颠倒：先 % 后换行。反过来会把刚生成的 %0A 再转义成 %250A。
              body = body.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              title = title.replace("%", "%25").replace(":", "%3A").replace(",", "%2C")
              print("::error title={}::{}".format(title, body))

          def clip(s, n=MAXC):
              if len(s) <= n:
                  return s
              h = n * 2 // 3
              return s[:h] + "\n…（中间省略 {} 字符）…\n".format(len(s) - n) + s[-(n - h):]

          # DATA RACE 块：WARNING 前那行 ==== 起，到块尾那行 ==== 止
          BAR = re.compile(r"^={10,}\s*$")
          races, i = [], 0
          while i < len(lines):
              if lines[i].strip() == "WARNING: DATA RACE":
                  s = i - 1 if i > 0 and BAR.match(lines[i - 1]) else i
                  j = i + 1
                  while j < len(lines) and not BAR.match(lines[j]):
                      j += 1
                  races.append("\n".join(lines[s:min(j + 1, len(lines))]))
                  i = j + 1
              else:
                  i += 1

          # 同一条竞态常重复报：归一化地址与协程号后去重（file:line 保留，那是判别依据）
          def sig(b):
              return re.sub(r"goroutine \d+", "goroutine N", re.sub(r"0x[0-9a-fA-F]+", "0xX", b))

          seen, uniq = set(), []
          for b in races:
              if sig(b) not in seen:
                  seen.add(sig(b))
                  uniq.append(b)

          subs = [l.strip() for l in lines if re.match(r"^\s*--- FAIL", l)]  # ^\s* 才收得到子测试
          pkgs = [l.strip() for l in lines if re.match(r"^FAIL\s+\S", l)]    # 丢掉无信息的裸 FAIL 行
          fails = subs + pkgs
          builds = [l for l in lines if re.match(r"^# \S", l) or re.match(r"^\S+\.go:\d+:\d+: ", l)]

          head = ["模块 {}：FAIL {} 条（用例 {} / 包 {}），DATA RACE {} 块（去重 {} 块）".format(
              MOD, len(fails), len(subs), len(pkgs), len(races), len(uniq))]
          if builds:
              head.append("编译错误 {} 行，前 5 行：".format(len(builds)))
              head += builds[:5]
          if not fails and not races:
              head.append("未匹配到 FAIL/RACE —— 可能是超时 panic、模块解析失败或 OOM，见日志尾部")
          emit("go test {} 概览".format(MOD), clip("\n".join(head), 2000))

          # ★竞态块排在用例名之前：每步注解有条数上限，超出时丢的是靠后那些，
          #   而栈是这里唯一别处拿不到的东西。
          for n, b in enumerate(uniq[:2], 1):
              emit("DATA RACE {}/{} {}".format(n, len(uniq), MOD), clip(b))

          for l in fails[:4]:
              emit("go test {}".format(MOD), l)

          # 失败现场；重叠窗口合并，避免父测试与子测试各刷一遍同样的 20 行
          spans = []
          for n, l in enumerate(lines):
              if re.match(r"^\s*--- FAIL", l):
                  a, b = n, min(n + 20, len(lines))
                  if spans and a <= spans[-1][1]:
                      spans[-1] = (spans[-1][0], max(spans[-1][1], b))
                  else:
                      spans.append((a, b))
          ctx = []
          for a, b in spans:
              ctx += lines[a:b] + ["--"]
          if not ctx:
              ctx = ["── 日志尾部 ──"] + lines[-60:]
          emit("gotest-detail {}".format(MOD), clip("\n".join(ctx)))
          PY
          exit 1

      # 生产二进制走的是 CGO_ENABLED=0 交叉编译，与上面 -race 那次是两套编译条件。
      # 只测不编的话，"测试全过但 linux/amd64 编不出来"会一路漏到部署那天。
      - name: 交叉编译成部署用的那个形态（CGO_ENABLED=0 linux/amd64）
        working-directory: ${{ matrix.mod }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./...

  console:
    name: 控制台（type-check + build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: 依赖
        working-directory: console
        run: npm ci

      - name: type-check
        working-directory: console
        run: npm run type-check

      # ★build 不是 type-check 的重复：vue-tsc 只看类型，vite build 还会做
      #   模块解析、资源引用、按需引入插件那一层。改错一个 import 路径时
      #   type-check 照样过，build 才炸——而用户拿到的是 build 的产物。
      - name: build
        working-directory: console
        run: npm run build

  e2e:
    name: 全链路自检（真敲门 / 真隧道 / 真 IKEv2 / 真反代）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 三个脚本都要同时起 control 与 gateway 两个模块的二进制，
      # 而两个模块的 go.mod 要求不同版本 —— 取**较高**那个（gateway 1.26.3），
      # Go 向后兼容，高版本编得动低版本的模块。
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod

      # ★装 lsof 不是可有可无：三个脚本的 preflight_port 用它探端口占用，
      #   而 GitHub 的 ubuntu runner 镜像**不默认装 lsof**。缺了它，脚本会打印
      #   「无法预检」的警告然后继续（那道守卫已经改成不再静默放行了），
      #   但那等于把一道本可以一句话报出来的端口冲突，推迟成后面某一步的莫名失败。
      #   在 CI 上我们要的是真检查，所以显式装上。
      - name: 装 lsof（端口预检要用；runner 镜像不自带）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lsof

      - name: 环境自证
        run: |
          echo "内核：$(uname -a)"
          echo "go：$(go version)"
          echo "python3：$(python3 --version)"
          echo "lsof：$(command -v lsof || echo '没有——端口预检会退化成警告')"
          # 这三个脚本在 CI 上从没跑过，第一次红的时候需要能分清
          # 是"代码坏了"还是"环境不合"。
          ss -lntu 2>/dev/null | head -20 || true

      # ★三条分开跑、且都带 if: always()：它们验的是三条**互不相干**的链路
      #   （L4 隧道 / 七层反代 / 站点组网）。合成一步的话，前一条挂了后两条根本不执行，
      #   而"没跑"与"跑挂了"在结果里长得一模一样 —— 客户端那条流水线刚在这上面
      #   栽过（msi 先跑且失败即中止，nsis 前三轮一次都没执行过）。
      - name: e2e.sh（登录→剖面→敲门→钉扎→多资源路由→越权拒绝）
        if: always()
        working-directory: gateway
        run: |
          set -o pipefail
          if ./e2e.sh 2>&1 | tee /tmp/run-e2e.sh.log; then exit 0; fi
          # ★失败证据走 ::error:: 注解——Actions 日志与 job summary 对未登录一律不可见，
          #   注解是唯一公开通道（客户端流水线已实测三次）。脚本自己的输出 + 两端进程日志
          #   的尾部一起带上：e2e 类失败没有这三样就只能猜。
          python3 - <<'PY'
          import pathlib
          parts = ["── 脚本输出尾部 ──"]
          parts += pathlib.Path("/tmp/run-e2e.sh.log").read_text(errors="replace").splitlines()[-30:]
          for lg in ["/tmp/baidi-e2e/control.log","/tmp/baidi-e2e/gateway.log"]:
              q = pathlib.Path(lg)
              if q.exists():
                  parts.append(f"── {q.name} 尾部 ──")
                  parts += q.read_text(errors="replace").splitlines()[-20:]
          msg = "\n".join(parts)
          if len(msg) > 3500:
              msg = msg[-3500:]
          msg = msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=e2e.sh 失败::{msg}")
          PY
          exit 1

      - name: web-e2e.sh（七层代理九条断言）
        if: always()
        working-directory: gateway
        run: |
          set -o pipefail
          if ./web-e2e.sh 2>&1 | tee /tmp/run-web-e2e.sh.log; then exit 0; fi
          # ★失败证据走 ::error:: 注解——Actions 日志与 job summary 对未登录一律不可见，
          #   注解是唯一公开通道（客户端流水线已实测三次）。脚本自己的输出 + 两端进程日志
          #   的尾部一起带上：e2e 类失败没有这三样就只能猜。
          python3 - <<'PY'
          import pathlib
          parts = ["── 脚本输出尾部 ──"]
          parts += pathlib.Path("/tmp/run-web-e2e.sh.log").read_text(errors="replace").splitlines()[-30:]
          for lg in ["/tmp/baidi-web-e2e/control.log","/tmp/baidi-web-e2e/gateway.log"]:
              q = pathlib.Path(lg)
              if q.exists():
                  parts.append(f"── {q.name} 尾部 ──")
                  parts += q.read_text(errors="replace").splitlines()[-20:]
          msg = "\n".join(parts)
          if len(msg) > 3500:
              msg = msg[-3500:]
          msg = msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=web-e2e.sh 失败::{msg}")
          PY
          exit 1

      - name: ipsec-e2e.sh（真 IKEv2 协商 + 真 ESP 加密 + 跨隧道业务流量）
        if: always()
        working-directory: gateway
        run: |
          set -o pipefail
          if ./ipsec-e2e.sh 2>&1 | tee /tmp/run-ipsec-e2e.sh.log; then exit 0; fi
          # ★失败证据走 ::error:: 注解——Actions 日志与 job summary 对未登录一律不可见，
          #   注解是唯一公开通道（客户端流水线已实测三次）。脚本自己的输出 + 两端进程日志
          #   的尾部一起带上：e2e 类失败没有这三样就只能猜。
          python3 - <<'PY'
          import pathlib
          parts = ["── 脚本输出尾部 ──"]
          parts += pathlib.Path("/tmp/run-ipsec-e2e.sh.log").read_text(errors="replace").splitlines()[-30:]
          for lg in ["/tmp/baidi-ipsec-e2e/control.log","/tmp/baidi-ipsec-e2e/ipsec-a.log","/tmp/baidi-ipsec-e2e/ipsec-b.log"]:
              q = pathlib.Path(lg)
              if q.exists():
                  parts.append(f"── {q.name} 尾部 ──")
                  parts += q.read_text(errors="replace").splitlines()[-20:]
          msg = "\n".join(parts)
          if len(msg) > 3500:
              msg = msg[-3500:]
          msg = msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=ipsec-e2e.sh 失败::{msg}")
          PY
          exit 1
