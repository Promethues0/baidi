distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# ★缺口（未修）：这里少一行 distributionSha256Sum=，于是下面这个 zip 下载下来
# 不经任何校验就被解开执行（CI 里 ./gradlew 跑两次，复用同一条未校验的下载链）。
# 补法与 clients/desktop/src-tauri/fetch-wintun.sh 同一条纪律：哈希要从 Gradle 官方
# release-checksums 页面**人工逐字符抄**（8.7 的 Binary-only (-bin) ZIP Checksum），
# 绝不能把下载到的 zip 算一遍填上——那等于给任何一次投毒盖章。没有可信来源就先别填。
# 填上之后要与下一行挨着：改版本号必须同一次改掉哈希（对不上时 wrapper 当场拒，不会静默）。
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
