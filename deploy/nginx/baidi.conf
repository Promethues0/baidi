# 白帝控制台 nginx 站点（共存版）：独立端口、**非 default_server**。
# 该机已有烛龙 nginx 独占 80/443 的 default_server；白帝绝不抢占——只在 @BD_HTTPS_PORT@(默认 9443)
# 起一个具名 server，零副作用于烛龙。占位由 install-remote.sh 渲染。
# 鉴权由白帝自身 JWT 负责（不再用 nginx basic-auth）。

# ── 限流区（http 级指令；conf.d 被 include 在 http{} 里，放这里合法）──
#
# ★为什么产品要自己发这份配置：`lockout.go` 的运行期告警字面写着
# 「建议：在前置 nginx 对 /api/v1/*/login 按源限速（limit_req）」——
# 代码在运行时把运维指向一份**产品自己不发**的配置。改造前 `grep limit_ deploy/` 零命中。
#
# ★它挡住的**不是**登录爆破：那个由控制面的 lockout 守卫（账号 + 源 IP 两维，默认全开）
# 已经防住了，且锁命中时直接 403 不再计数。这份配置真正覆盖的是另外三块：
#   ① 免认证大文件下载（/downloads/ 直发几十 MB，且 proxy_buffering off）——
#      并发连接是唯一的闸，limit_conn 就是给它加的；
#   ② 管理员手动关掉 IP 维度锁定（NAT 后办公网的常见运维动作）之后的登录面；
#   ③ 一切在 lockout 之前就能打到控制面的请求（解析、握手、写日志）的速率上界。
#
# 区名带 baidi_ 前缀：本机与烛龙共存，同名 zone 会在 nginx -t 时直接冲突。
# 键用 $binary_remote_addr（比字符串省内存）；10m 约 16 万个 /32 条目。
limit_req_zone  $binary_remote_addr zone=baidi_login:10m rate=20r/m;
limit_req_zone  $binary_remote_addr zone=baidi_api:10m   rate=30r/s;
limit_conn_zone $binary_remote_addr zone=baidi_dl:10m;

server {
    listen @BD_HTTPS_PORT@ ssl http2;    # 独立端口，不做默认站点；http2 写 listen 参数(兼容 nginx 1.24/1.25+)
    server_name @PUBLIC_HOST@;           # 具名，避免兜底抢占默认站点

    # ── 证书路径由 install-remote.sh 按「当前**真正可用**的那张」渲染 ──
    #
    # 两种取值，只有这两种：
    #   @BD_PREFIX@/etc/tls/server.crt|.key   自签（默认，WITH_ACME_IP_CERT=0 或签发失败）
    #   @BD_PREFIX@/etc/tls/le.crt|.key       Let's Encrypt **IP 地址证书**（WITH_ACME_IP_CERT=1 且已签到）
    #
    # ★这两行在机器上还会被第三方改写：续期脚本 $BD_PREFIX/bin/acme-renew.sh 在
    #   「续上了」时把它们指回 le.*、在「续不下来且剩余不足 24h」时切回自签。
    #   它用的是「行首空白 + 指令名 + 空白 + 任意路径 + 分号」的正则，不依赖这里的对齐方式；
    #   但**这两行必须各自独占一行**，写成一行两指令会让续期脚本改不动它们——
    #   而那个失败是静默的：nginx -t 通过、站点正常、只是证书永远停在旧那张上直到过期。
    ssl_certificate     @BD_TLS_CRT@;
    ssl_certificate_key @BD_TLS_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ── 安全响应头（NFR-SEC-08）─────────────────────────────────────────────
    #
    # ★改造前这个站点**一条安全响应头都没有**（`grep -rn add_header deploy/` 零命中）。
    #   管理台与终端用户门户同源共用这一个站点，任何外部页面都能把它整页 iframe 进去做
    #   点击劫持——被诱骗点到的是「禁用管理员」「撤销授权」「批准准入」这类一次点击就
    #   生效、且不再二次确认的按钮，而受害者的会话令牌就在这个源里。
    #
    # ★四条都带 `always`：不带时 nginx 只给 200/201/204/206/30x 加头，403/404/500 这些
    #   **恰恰是攻击者最容易稳定拿到的响应**反而裸奔（后端 5xx 页照样能被 iframe）。
    #
    # ★这几条写在 server 级，**任何 location 里都不许再出现 add_header**：nginx 的
    #   add_header 不是叠加而是**就近整组覆盖**——某个 location 里只要自己出现一条
    #   add_header，server 级这四条对该 location 全部失效。这件事完全静默：nginx -t 通过、
    #   页面正常，只有那一条路径的响应头空了。deploy/check-nginx.sh 有反向断言守着。
    #
    # ★也必须写在 80 端口块**之前**：非 443 部署时 install-remote.sh 会按
    #   @BD_HTTP80_BEGIN@/@BD_HTTP80_END@ 把那一整段删掉——头若写进那一段，共存机（9443，
    #   最常见的形态）上就会连同被删光，而 443 独占机上一切正常，两台机器行为不一致
    #   且都不报错。check-nginx.sh 同样断言了这一点。
    #
    # ★刻意**不发 Strict-Transport-Security**，两条理由都是硬的：
    #   ① HSTS 的作用域是**主机**不是端口（RFC 6797 §8.1）。在 9443 上发一条，就等于替
    #      同一主机名的 80/443 一起打开强制 HTTPS——而共存机上那两个端口归烛龙。这是对
    #      「绝不碰烛龙 80/443」那条共存契约的隔空违反，且症状出现在**别人的站点**上，
    #      查起来完全没有线索指向白帝。
    #   ② RFC 6797 §2.3 把 IP 地址主机排除在 HSTS 之外，浏览器对 https://101.43.125.131
    #      直接忽略该头——在演示站（裸 IP + LE 的 IP 证书）上它本来就是一条空头。
    #   443 独占机 + 真实域名的部署可以自行加回来，那时它才既有效又无副作用。
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── CSP：**逐页实跑验证过**的策略，不是抄来的模板 ────────────────────────
    #
    # ★验证方式（2026-09-10，本机）：`npm run build` 出产物 → 用一个只加这几条响应头的
    #   静态服务 + 真 baidi-control 反代跑起来 → 浏览器逐页走「登录 / 态势总览 / 大屏 /
    #   审计 / 网关 / 系统 / 用户与角色 / 应用 / 认证源 / 设备状态 / 诊断 / 门户登录」，
    #   控制台**零 CSP 违例**；并带反例复核：故意加载外站图片与内联脚本，两者都被拦下
    #   （不带反例的话，"没有违例"与"这个头压根没生效"完全同形）。
    #
    # ★为什么各项是这个值（每一条放宽都对应一处真实用法，不是保险起见多写的）：
    #   · script-src 'self'          —— Vite 产物里**没有内联 script**（index.html 只有一个
    #     带 src 的 module），所以这里既没有 'unsafe-inline' 也没有 'unsafe-eval'。
    #     这两个才是 CSP 挡 XSS 的全部价值所在，**以后谁想加进来都要先证明必要性**；
    #     "页面白了就先加 unsafe-inline" 是把这条头改成装饰品最常见的一步。
    #   · style-src 'unsafe-inline'  —— 无法避免：Vue 的 :style 绑定与 Arco 的运行时组件
    #     （Message/Modal/表格虚拟滚动/echarts 容器）都直接写元素的 style 属性，
    #     去掉这一项整站样式塌掉。它与 script 的 'unsafe-inline' 不是一回事。
    #   · fonts.googleapis.com / fonts.gstatic.com —— console/index.html 直接 <link> 了
    #     谷歌字体；漏掉这两处的症状是"能用但字体全变回系统默认"，很容易被当成没生效。
    #     （内网无外网出口的部署本来就取不到，那是网络问题不是 CSP 问题。）
    #   · img-src data:              —— TOTP 绑定二维码与下载中心的安卓包二维码是
    #     `QRCode.toDataURL()` 出来的 data: URI（PortalSecurity.vue / PortalDownloads.vue）。
    #   · connect-src 'self'         —— 控制台只打同源 /api 与 /downloads，全仓无跨源 fetch。
    #   · object-src/frame-src 'none'、base-uri/form-action 'self' —— 全仓无 <object>、
    #     无 iframe、无 <base>、无原生 <form> 提交（OIDC 走 location 跳转，CSP 不管导航）。
    #   · **不写 blob:** —— 各页「导出 CSV / 导出诊断报告 / 下载网关证书」用的是
    #     `createObjectURL` + `<a download>`，那是导航不是资源加载，CSP 不拦（已实跑确认）。
    #     为它加一条 blob: 只是白白放宽。
    #
    # ★frame-ancestors 'none' 是 X-Frame-Options 的现代等价物，两条并存是有意的：
    #   前者才是规范里被实现的那条，后者留给不认 CSP 的老浏览器。
    #   真要把大屏 /screen 嵌进别人的看板，请把这里改成显式的来源清单，别整条删掉。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'" always;

    root @BD_PREFIX@/web;
    index index.html;

    # SPA：管理台(/、/login、各功能页) 与 终端用户门户(/portal/*) 共用 history 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 存活探测：客户端「控制中心可达」那一格的唯一判据 ──
    #
    # ★这条 location 必须存在，且必须是**精确匹配**。改造前没有它，/healthz 落进上面
    #   那条 `location /` 的 SPA 回退 —— try_files 找不到同名文件 → 回 /index.html + 200。
    #   于是「控制面整个停掉」与「控制面健康」在 HTTP 层面**完全同形**：客户端 ping()
    #   拿到 200 就把界面点亮成「控制中心可达」。参考部署下这是一个**必然**假阳性，
    #   不是偶发时序问题，是配置决定的——控制面停多久它就绿多久。
    #   （本仓反复出现的那一族缺陷：配置齐全、零报错、方向恰好相反。）
    #
    # ★后端确实有这个端点，是先核实过才开的通路：control/internal/api/api.go 的
    #   `GET /healthz`（注册在 Routes() 上 = 明文口，且在同文件的免认证白名单里）。
    #   给一个不存在的后端端点开 location 只会把 404 换个地方出现，反而更难查。
    #
    # ★「挂了」与「活着」在 HTTP 层怎么分得开：控制面进程不在时 nginx 连不上 upstream
    #   → 502。本站刻意不设 error_page、也不开 proxy_intercept_errors（默认 off），
    #   502 原样透回客户端。加 error_page 把 5xx 兜成 index.html 就会把这条通路重新
    #   变回恒 200，等于白改——以后给本站加 error_page 时请绕开这条。
    #
    # ★不能指望通配：SPA 回退会把**任何**未被更精确 location 命中的路径变成 200 HTML。
    #   以后再加探测/健康端点，照这条逐个精确列出来，别指望前缀匹配替你兜住。
    location = /healthz {
        # 免认证端点，挂上与 /api/ 同一个速率上界；不挂的话它就是一个零配额的免认证入口。
        # burst 20：探测本身每分钟几次，这个余量只为多客户端并发探测时不误伤。
        limit_req zone=baidi_api burst=20 nodelay;
        limit_req_status 429;

        # ★这条**刻意不 include baidi-proxy-api.inc**，是本文件里唯一的例外，理由有二：
        #   ① 那份片段的 proxy_read_timeout 是 3600s（管理 API 要长连接），而探测要的恰恰
        #      相反——控制面「进程活着但卡死/库锁住」时，探测必须在几秒内失败，否则界面
        #      会挂在「检测中」而不是报不可达，那与假阳性同样坏（用户看不出区别）。
        #   ② nginx 不允许同一 location 里出现两次 proxy_read_timeout（duplicate directive
        #      会让**整台机器**的 nginx 起不来，包括共存的烛龙），所以只能整段自己写，
        #      不能 include 完再覆盖一行。
        # 也刻意不透传 Authorization：探测是免认证的，没有理由让它带上凭据出门。
        proxy_pass http://127.0.0.1:@CONTROL_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # 登录端点单独限速：20 次/分钟/源，burst 10 不排队（超出立即 429 而不是拖着连接）。
    #
    # ★阈值按「人」定而不是按「攻击者」定：一个真人一分钟点不了 20 次登录，
    # 而这个速率对分布式喷洒（约 820 个不同 /64、每源 5 个请求）本来就无用——
    # 那一档由 lockout 的账号维度接住。写得更严只会误伤共用出口 IP 的办公网。
    # 精确匹配三条登录入口，不用前缀匹配：把整个 /api/ 压到 20r/m 会让控制台不可用。
    location = /api/v1/auth/login {
        # ── 控制台接入 IP 限制（PRD FR-SYSCFG-08，P0）──
        #
        # ★白帝**刻意不做成应用层开关**：那种开关只能挡住已经走到应用的请求，
        #   而管理面真正需要的是「根本连不上」。正确位置就是这里（或更前面的防火墙）。
        #   放开注释即生效；deny 必须在最后一行，nginx 按顺序匹配、首个命中即生效。
        #
        # ★只能切**管理台登录端点**，不能整段 /api/ 白名单化：管理台与终端用户门户
        #   同源（都在 /），门户用户走的是 /api/v1/portal/login —— 把整个 /api/ 关掉
        #   等于连业务用户一起挡在门外。管理 API 若也要限制，逐条照抄这几行到
        #   /api/v1/admins、/api/v1/upgrade/backup 等敏感端点上。
        #
        # allow 10.8.0.0/16;      # 运维网段
        # allow 203.0.113.10;     # 跳板机
        # deny  all;

        limit_req zone=baidi_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/baidi-proxy-api.inc;
    }
    location = /api/v1/portal/login {
        limit_req zone=baidi_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/baidi-proxy-api.inc;
    }
    location = /api/v1/auth/totp {
        limit_req zone=baidi_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/baidi-proxy-api.inc;
    }

    # 管理 API 反代到 baidi-control（回环；保留 /api 前缀；透传 Bearer）
    location /api/ {
        # 已认证 API 的速率上界（FR-INT-16 在白帝形态下的唯一真实读法：
        # 控制面没有 per-token 配额，这里只有一层按源 IP 的粗粒度上界）。
        # 30r/s + burst 60：正常控制台一屏并发十几个请求，留足余量。
        limit_req zone=baidi_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:@CONTROL_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
    }

    # 客户端安装包分发（manifest 白名单校验在 baidi-control 内；大文件直通不缓冲）
    location /downloads/ {
        # ★这是**免认证**的大文件出口（几十 MB 直发，且下面 proxy_buffering off，
        # 每个下载都占住一条到 control 的连接直到传完）。改造前它一个闸都没有：
        # 单机开几百条并发就能把 control 的连接与带宽吃干，而 lockout 只管登录。
        # 按源限 4 条并发；限的是**连接数**不是速率——大文件的成本在连接寿命上。
        limit_conn baidi_dl 4;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:@CONTROL_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# HTTP(80) 具名 server：HTTPS 跳转 + ACME HTTP-01 挑战通路
#
# ★这一段**只在独占标准端口（BD_HTTPS_PORT=443）时保留**，install-remote.sh 在别的端口上
#   按下面这对标记整段删掉。共存机（默认 9443）的 80 端口归烛龙的 default_server，
#   白帝绝不去争——这也是 WITH_ACME_IP_CERT 只支持 443 独占机的原因（见 install-remote.sh）。
#
# ★仍然**不是** default_server：只以 server_name 具名接管 Host 匹配的请求。
# @BD_HTTP80_BEGIN@
server {
    listen 80;
    server_name @PUBLIC_HOST@;

    # ── ACME HTTP-01 挑战（Let's Encrypt IP 地址证书，WITH_ACME_IP_CERT=1 时用）──
    #
    # ★为什么跳转必须写在 `location /` 里、而不能写成 server 级的 `return 301`：
    #   nginx 的 `return` 属于 rewrite 模块，**在 rewrite 阶段执行，早于 location 选择**。
    #   写在 server 级时，本 server 收到的每一个请求（含 /.well-known/acme-challenge/xxx）
    #   都会在挑选 location 之前就被 301 走 —— 下面这条 location 一次都不会被命中。
    #   后果全是静默的：nginx -t 通过、站点正常、跳转正常，只有签发那一步失败，
    #   而 lego 报的是「404 / 拿不到挑战文件」，看起来像 webroot 配错了。
    #   （2026-09-08 演示站实测踩到过：改成下面这个形状之后一次签发成功。）
    #   deploy/check-nginx.sh 有构建期断言守着这个形状，别改回 server 级。
    #
    # ★这条 location 与 WITH_ACME_IP_CERT 无关、恒定存在：开关关掉时它指向的
    #   /var/www/html/.well-known/acme-challenge/ 是空目录 → 404，没有任何副作用；
    #   而「要签证书时才临时加一条 location」意味着签发那天要动 nginx 配置，
    #   那正是本文件历史上出过事的地方。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
# @BD_HTTP80_END@
