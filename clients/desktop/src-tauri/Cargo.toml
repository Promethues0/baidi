[package]
name = "baidi-desktop"
version = "0.1.0"
description = "白帝安全接入桌面客户端"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 只为一个 geteuid(2)：私有运行目录要复核属主（标准库没有取 uid 的 API）。
# libc 本来就在依赖树里（tauri 传递依赖），这里只是显式引一次，不引入新的供应链面。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "baidi-desktop"
path = "src/main.rs"
